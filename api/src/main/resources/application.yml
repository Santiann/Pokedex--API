spring:
  application:
    name: pokedex
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

pokedex:
  warmup: true
